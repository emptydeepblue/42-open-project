; Pin every platform and library version so the whole team builds with the same toolchain.

[env:native]
; Protocol tests and simulator on the PC. No hardware needed.
platform = native@1.2.1
test_framework = unity
build_flags = -std=gnu++17 -Wall -Wextra
lib_deps =
    throwtheswitch/Unity@2.6.1
; Hardware drivers include ESP32-only headers: never compile them on the PC.
lib_ignore = radio_esp32

; ESP32 firmware: enable once the framework (Arduino or ESP-IDF) is decided
; and src/main.cpp exists. Pin the platform version when adding it.
;[env:esp32]
;platform = espressif32@<pinned version>
;board = esp32dev
;framework = <arduino | espidf>
;monitor_speed = 115200
